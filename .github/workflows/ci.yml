name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-build-frontend:
    name: Frontend lint, types, i18n & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Locale integrity (keys, placeholders, native numerals)
        run: npm test
      - run: npm run build

  e2e-frontend:
    name: Frontend end-to-end journeys (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python Syntax
        run: cd backend && python -m py_compile $(find . -name "*.py")
      - name: Install Dependencies
        run: pip install uv && uv pip install --system -r backend/requirements.txt
      - name: Run Pytest
        env:
          # Optional: when this secret exists, tests/test_earth_engine.py also queries real Sentinel-2 data.
          EE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_KEY_JSON }}
        # tests/conftest.py migrates a throwaway SQLite database for the run.
        run: uv pip install --system pytest pytest-asyncio && pytest backend/tests/

  test-backend-postgres:
    name: Test Backend (PostgreSQL Concurrency)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: krishi
          POSTGRES_PASSWORD: password
          POSTGRES_DB: krishisathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install uv && uv pip install --system -r backend/requirements.txt pytest pytest-asyncio asyncpg psycopg2-binary
      - name: Run Postgres Concurrency Tests
        # tests/conftest.py runs the migrations against TEST_DATABASE_URL, the only database tests may write to.
        run: cd backend && TEST_DATABASE_URL="postgresql+asyncpg://krishi:password@localhost:5432/krishisathi" python -m pytest tests/test_p05_postgres.py

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-build-frontend:
    name: Lint & Build Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: cd frontend && npm install
      - name: Run Linter
        run: cd frontend && npm run lint
      - name: Build Frontend
        run: cd frontend && npm run build

  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Check Python Syntax
        run: cd backend && python -m py_compile $(find . -name "*.py")
      - name: Install Dependencies
        run: pip install uv && uv pip install --system -r backend/requirements.txt
      - name: Run Pytest
        run: uv pip install --system pytest pytest-asyncio && pytest backend/tests/

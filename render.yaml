services:
  - type: web
    name: krishisathi-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      # Optional Sentinel-2 via Google Earth Engine (docs/EARTH_ENGINE.md). Set as secrets, never in this file.
      - key: EE_SERVICE_ACCOUNT_KEY_JSON
        sync: false
      - key: EE_PROJECT
        sync: false
